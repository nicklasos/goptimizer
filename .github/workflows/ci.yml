name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  TEST_DATABASE_PATH: ./data/goptimizer_test.db

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Formatting
        run: test -z "$(gofmt -l cmd config internal tests | grep -v '^internal/db/.*\.sql\.go$')"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: make test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The E2E suite starts the API from ../backend, which reads its settings from .env
      - name: Backend environment
        working-directory: backend
        run: |
          cat > .env <<ENV
          DATABASE_PATH=$TEST_DATABASE_PATH
          TEST_DATABASE_PATH=$TEST_DATABASE_PATH
          JWT_SECRET=ci-only-secret-not-used-anywhere-else
          APP_ENV=test
          LOG_OUTPUT=stdout
          ENV

      - name: Frontend environment
        run: cp .env.example .env

      - name: Install dependencies
        run: npm ci

      - name: Generated API types are up to date
        run: make api-types-check

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Typecheck, lint, unit and E2E tests
        run: make test

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: pipx install --include-deps ansible

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Syntax check
        run: |
          cp inventory/hosts.example.yml inventory/hosts.yml
          ansible-playbook provision.yml --syntax-check
          ansible-playbook deploy.yml --syntax-check
