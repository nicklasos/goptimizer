# Releases the current code of repo_branch: the image tools it needs, then pull, build, migrate,
# restart and wait for /health.
#
#   ansible-playbook deploy.yml
- name: Deploy the application
  hosts: all
  become: true
  pre_tasks:
    - name: Preflight checks
      ansible.builtin.import_tasks: preflight.yml
      tags: always
  roles:
    - imagetools
    - app
    - nginx
