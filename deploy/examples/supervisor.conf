; Example for a server set up by hand (see ../MANUAL_INSTALL.md).
; Copy to /etc/supervisor/conf.d/gogobackup.conf, then: supervisorctl update
;
; There is no cron program: with ENABLE_SCHEDULER=true in backend/.env the API runs the
; scheduled jobs and the backups itself.

[program:gogobackup-api]
command=/var/www/gogobackup/backend/bin/api
directory=/var/www/gogobackup/backend
user=www-data
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/var/log/gogobackup/api.log
stderr_logfile=/var/log/gogobackup/api-error.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=10
stopsignal=TERM
; The API finishes in-flight requests for up to 20 seconds, then stops the backups in progress
; and records them as failed, before it exits
stopwaitsecs=45
