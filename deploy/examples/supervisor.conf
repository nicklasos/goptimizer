; Example for a server set up by hand (see ../MANUAL_INSTALL.md).
; Copy to /etc/supervisor/conf.d/goptimizer.conf, then: supervisorctl update
;
; There is no cron program: with ENABLE_SCHEDULER=true in backend/.env the API runs the
; scheduled jobs itself.

[program:goptimizer-api]
command=/var/www/goptimizer/backend/bin/api
directory=/var/www/goptimizer/backend
user=www-data
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/var/log/goptimizer/api.log
stderr_logfile=/var/log/goptimizer/api-error.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=10
stopsignal=TERM
; The API finishes in-flight requests for up to 20 seconds and waits for running jobs before it exits
stopwaitsecs=45
