- name: Add the NodeSource repository
  ansible.builtin.deb822_repository:
    name: nodesource
    types: deb
    uris: "https://deb.nodesource.com/node_{{ node_major }}.x"
    suites: nodistro
    components: main
    signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
  register: nodesource_repo

- name: Install Node.js {{ node_major }}
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: "{{ nodesource_repo is changed }}"
