# Every setting of a deployment. Secrets live in secrets.yml next to this file.

# --- The application --------------------------------------------------------
# Short name: used for the database file, log and config names.
# Lower-case letters, digits and dashes.
app_name: gogobackup

# Shown in emails
app_display_name: Gogobackup

# Where the code comes from. For a private repository use the SSH URL and add the
# deploy key the first run prints to the repository on GitHub.
repo_url: git@github.com:nicklasos/gogobackup.git
repo_branch: main

# --- Hostnames and TLS ------------------------------------------------------
# Serves the admin panel and proxies /api to the Go API. DNS must point here before provisioning.
domain: example.com

# Optional second hostname that serves the API only, for mobile apps or other clients.
api_domain: ""

# letsencrypt  certificates from Let's Encrypt, HTTP redirected to HTTPS (needs letsencrypt_email)
# cloudflare   plain HTTP on port 80 behind Cloudflare, which terminates TLS
# none         plain HTTP, for a test server
tls_mode: letsencrypt
letsencrypt_email: you@example.com

# --- Server -----------------------------------------------------------------
# The unprivileged account that owns the code and runs the API
app_user: deploy
app_root: "/var/www/{{ app_name }}"
timezone: Etc/UTC

# A swap file keeps the frontend build from being killed on a small server. 0 turns it off.
swap_size_mb: 2048

go_version: "1.25.4"
node_major: 22

# --- API --------------------------------------------------------------------
api_port: 8181

# The API runs the scheduled jobs and the backups. false runs them in a separate <app>-cron
# supervisor program instead.
scheduler_in_api: true

# How many backups and restores run at once. A plan runs one at a time.
runner_concurrency: 2

# Parallel jobs of pg_restore. Up to the server's cores helps a large database.
restore_jobs: 4

# The dump programs backups of PostgreSQL and MySQL sources run, from the distribution. pg_dump
# must be at least the major version of every server it dumps; for a newer server than the
# distribution's client, see "Dump tools" in deploy/README.md. Turn one off when no plan needs it.
install_postgres_client: true
install_mysql_client: true

# Open POST /auth/register to anyone
allow_registration: false

# Serve the API documentation at /swagger/
expose_swagger: false

jwt_access_token_ttl: 1h
jwt_refresh_token_ttl: 720h

# --- Mail (leave mail_host empty to send nothing) ---------------------------
mail_host: ""
mail_port: 587
# smtp (STARTTLS), smtps (implicit TLS) or none
mail_scheme: smtp
mail_username: ""
mail_from_address: "noreply@{{ domain }}"
mail_from_name: "{{ app_display_name }}"

# --- Backing up Gogobackup itself ---------------------------------------------
# Every deploy makes sure the plan "Gogobackup itself" backs up the database, daily at 03:15 UTC, to
# a local storage in self_backup_dir. A plan that already backs up the database is left as you edited
# it. false stops creating it, for example after you deleted the plan on purpose.
self_backup_enabled: true
self_backup_dir: "{{ app_root }}/shared/backups"

# --- Derived (no need to change) --------------------------------------------
# Outside the checkout, in a folder of its own: SQLite writes -wal and -shm files next to the database
database_path: "{{ app_root }}/shared/database/{{ app_name }}.db"
# Where restores download archives and extract files by default. A Postgres restore downloads
# the whole archive here first, so it needs room for the largest one.
work_dir: "{{ app_root }}/shared/work"
site_scheme: "{{ 'http' if tls_mode == 'none' else 'https' }}"
site_url: "{{ site_scheme }}://{{ domain }}"
log_dir: "/var/log/{{ app_name }}"
backend_dir: "{{ app_root }}/backend"
frontend_dir: "{{ app_root }}/frontend"
go_env:
  PATH: "/usr/local/go/bin:/usr/local/bin:/usr/bin:/bin"
  CGO_ENABLED: "0"
  GOFLAGS: "-buildvcs=false"
