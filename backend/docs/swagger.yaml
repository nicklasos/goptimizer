          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      summary: Request a password reset
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
