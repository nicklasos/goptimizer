host: localhost:8181
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: 'Gogobackup: storages, backup plans and the accounts that manage them'
  license:
    name: WTFPL
    url: http://www.wtfpl.net/
  termsOfService: http://swagger.io/terms/
  title: Gogo API Template
  version: "1.0"
paths:
  /api/v1/archives/{id}/download:
    get:
      description: Streams the archive's object from its storage, as an attachment
        named after the object. An archive that retention deleted is a 404; a storage
        that fails, or has lost the object, a 502 storages.unreachable. A browser
        uses a download link instead. Admins only.
      parameters:
      - description: Archive ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Download an archive
      tags:
      - runs
  /api/v1/archives/{id}/download-link:
    post:
      consumes:
      - application/json
      description: A token for GET /api/v1/downloads/{token}, valid for a minute.
        A browser follows it to save a large archive straight to disk; a request with
        the Authorization header cannot do that. Admins only.
      parameters:
      - description: Archive ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_runs.DownloadLinkDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Make a download link for an archive
      tags:
      - runs
  /api/v1/archives/{id}/restore:
    post:
      consumes:
      - application/json
      description: Queues a restore of the archive into the target in the block of
        the plan's source kind. Blank database connection fields and a blank password
        are the plan's. A target that is the plan's own source (the same server and
        database, the same SQLite path, or files to their original locations) needs
        confirm set to the database name, the path or "original locations", or it
        is a 400 restores.confirm_mismatch on confirm. The worker starts it once no
        run or other restore of the plan is running; a plan with a restore queued
        or running already is a 409 restores.in_progress. A deleted archive is a 404
        archives.not_found. Admins only.
      parameters:
      - description: Archive ID
        in: path
        name: id
        required: true
        type: integer
      - description: Restore target
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/app_internal_plans.RestoreRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/internal_runs.RestoreDetailDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ValidationErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Restore an archive
      tags:
      - restores
  /api/v1/archives/{id}/restore-target:
    get:
      consumes:
      - application/json
      description: 'The plan''s own source, in the block of its kind, for a restore
        form to start from: for a database its server and database, for SQLite its
        path, for files a new directory in the work directory. Restoring over the
        plan''s own source needs confirm. Admins only.'
      parameters:
      - description: Archive ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_runs.RestoreTargetDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get the default target of a restore
      tags:
      - restores
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Emails a single-use reset link when the address belongs to an account.
        Always answers 200, so it does not reveal which emails are registered.
      parameters:
      - description: Account email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.ForgotPasswordRequest'
