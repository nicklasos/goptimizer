basePath: /
definitions:
  app_internal_errs.ErrorResponse:
    properties:
      details:
        additionalProperties: true
        type: object
      error_key:
        type: string
      message:
        type: string
      status:
        type: integer
      timestamp:
        type: string
    required:
    - error_key
    - status
    type: object
  app_internal_tools.Need:
    enum:
    - png_lossy
    - png_lossless
    - jpeg
    - gif
    type: string
    x-enum-varnames:
    - NeedPNGLossy
    - NeedPNGLossless
    - NeedJPEG
    - NeedGIF
  app_internal_tools.NeedStatus:
    properties:
      missing:
        description: Missing is the preferred program of each step nothing installed
          can do.
        items:
          type: string
        type: array
      need:
        allOf:
        - $ref: '#/definitions/app_internal_tools.Need'
        enum:
        - png_lossy
        - png_lossless
        - jpeg
        - gif
      satisfied:
        type: boolean
    required:
    - missing
    - need
    - satisfied
    type: object
  app_internal_tools.ProgramStatus:
    properties:
      alternatives:
        description: Alternatives can do this program's work when it is missing. Empty
          means it is required.
        items:
          type: string
        type: array
      apt:
        type: string
      brew:
        type: string
      installed:
        type: boolean
      name:
        type: string
      path:
        type: string
      purpose:
        type: string
      used_for:
        items:
          $ref: '#/definitions/app_internal_tools.Need'
          enum:
          - png_lossy
          - png_lossless
          - jpeg
          - gif
        type: array
      version:
        type: string
    required:
    - alternatives
    - apt
    - brew
    - installed
    - name
    - path
    - purpose
    - used_for
    - version
    type: object
  app_internal_tools.Report:
    properties:
      needs:
        items:
          $ref: '#/definitions/app_internal_tools.NeedStatus'
        type: array
      programs:
        items:
          $ref: '#/definitions/app_internal_tools.ProgramStatus'
        type: array
    required:
    - needs
    - programs
    type: object
  internal.MessageData:
    properties:
      message:
        type: string
    required:
    - message
    type: object
  internal.MessageResponse:
    properties:
      data:
        $ref: '#/definitions/internal.MessageData'
    required:
    - data
    type: object
  internal.PaginationMeta:
    properties:
      current_page:
        type: integer
      last_page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
    required:
    - current_page
    - last_page
    - per_page
    - total
    type: object
  internal_auth.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  internal_auth.LoginDataResponse:
    properties:
      data:
        $ref: '#/definitions/internal_auth.LoginResponse'
    required:
    - data
    type: object
  internal_auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_auth.LoginResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/internal_auth.UserResponse'
    required:
    - access_token
    - refresh_token
    - user
    type: object
  internal_auth.RefreshTokenDataResponse:
    properties:
      data:
        $ref: '#/definitions/internal_auth.RefreshTokenResponse'
    required:
    - data
    type: object
  internal_auth.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  internal_auth.RefreshTokenResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    required:
    - access_token
    - refresh_token
    type: object
  internal_auth.RegisterDataResponse:
    properties:
      data:
        $ref: '#/definitions/internal_auth.RegisterResponse'
    required:
    - data
    type: object
  internal_auth.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - name
    - password
    type: object
  internal_auth.RegisterResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/internal_auth.UserResponse'
    required:
    - access_token
    - refresh_token
    - user
    type: object
  internal_auth.ResetPasswordRequest:
    properties:
      password:
        minLength: 8
        type: string
      token:
        type: string
    required:
    - password
    - token
    type: object
  internal_auth.UpdatePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        minLength: 8
        type: string
    required:
    - current_password
    - new_password
    type: object
  internal_auth.UpdateProfileRequest:
    properties:
      email:
        type: string
      name:
        type: string
    required:
    - email
    - name
    type: object
  internal_auth.UserDataResponse:
    properties:
      data:
        $ref: '#/definitions/internal_auth.UserResponse'
    required:
    - data
    type: object
  internal_auth.UserResponse:
    properties:
      email:
        type: string
      email_verified:
        type: boolean
      id:
        type: integer
      is_admin:
        type: boolean
      name:
        type: string
    required:
    - email
    - email_verified
    - id
    - is_admin
    - name
    type: object
  internal_auth.VerifyEmailRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  internal_folders.FolderDataResponse:
    properties:
      data:
        $ref: '#/definitions/internal_folders.FolderResponse'
    required:
    - data
    type: object
  internal_folders.FolderRequest:
    properties:
      full_scan_interval_hours:
        maximum: 720
        minimum: 1
        type: integer
      kind:
        allOf:
        - $ref: '#/definitions/internal_folders.Kind'
        enum:
        - local
      name:
        maxLength: 100
        type: string
      path:
        type: string
      profile:
        $ref: '#/definitions/internal_folders.Profile'
      scan_interval_minutes:
        maximum: 10080
        minimum: 5
        type: integer
    required:
    - name
    - path
    type: object
  internal_folders.FolderResponse:
    properties:
      created_at:
        type: string
      enabled:
        type: boolean
      full_scan_interval_hours:
        type: integer
      id:
        type: integer
      kind:
        allOf:
        - $ref: '#/definitions/internal_folders.Kind'
        enum:
        - local
      name:
        type: string
      path:
        type: string
      profile:
        $ref: '#/definitions/internal_folders.Profile'
      scan_interval_minutes:
        type: integer
      updated_at:
        type: string
    required:
    - created_at
    - enabled
    - full_scan_interval_hours
    - id
    - kind
    - name
    - path
    - profile
    - scan_interval_minutes
    - updated_at
    type: object
  internal_folders.FoldersResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/internal_folders.FolderResponse'
        type: array
    required:
    - data
    type: object
  internal_folders.Kind:
    enum:
    - local
    type: string
    x-enum-varnames:
    - KindLocal
  internal_folders.Mode:
    enum:
    - lossy
    - lossless
    type: string
    x-enum-varnames:
    - ModeLossy
    - ModeLossless
  internal_folders.Profile:
    properties:
      excludes:
        items:
          type: string
        type: array
      gif_lossy:
        type: integer
      jpeg_max_quality:
        type: integer
      min_age_minutes:
        type: integer
      min_saving_percent:
        type: integer
      min_ssim:
        type: number
      mode:
        allOf:
        - $ref: '#/definitions/internal_folders.Mode'
        enum:
        - lossy
        - lossless
      png_quality_max:
        type: integer
      png_quality_min:
        type: integer
    required:
    - excludes
    - gif_lossy
    - jpeg_max_quality
    - min_age_minutes
    - min_saving_percent
    - min_ssim
    - mode
    - png_quality_max
    - png_quality_min
    type: object
  internal_folders.SetEnabledRequest:
    properties:
      enabled:
        type: boolean
    required:
    - enabled
    type: object
  internal_settings.SettingsDataResponse:
    properties:
      data:
        $ref: '#/definitions/internal_settings.SettingsResponse'
    required:
    - data
    type: object
  internal_settings.SettingsRequest:
    properties:
      nice:
        description: Nice runs the tools under nice and ionice, so the projects on
          the server stay fast.
        type: boolean
      scan_workers:
        maximum: 16
        minimum: 1
        type: integer
      workers:
        description: Workers is how many images are optimized at once; 0 means one
          less than the CPU count.
        maximum: 64
        minimum: 0
        type: integer
    required:
    - nice
    - scan_workers
    - workers
    type: object
  internal_settings.SettingsResponse:
    properties:
      effective_workers:
        type: integer
      nice:
        type: boolean
      scan_workers:
        type: integer
      updated_at:
        type: string
      workers:
        type: integer
    required:
    - effective_workers
    - nice
    - scan_workers
    - updated_at
    - workers
    type: object
  internal_settings.ToolsResponse:
    properties:
      data:
        $ref: '#/definitions/app_internal_tools.Report'
    required:
    - data
    type: object
  internal_users.CreateUserRequest:
    properties:
      email:
        type: string
      is_admin:
        type: boolean
      name:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - is_admin
    - name
    - password
    type: object
  internal_users.PaginatedUsersResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/internal_users.UserResponse'
        type: array
      pagination:
        $ref: '#/definitions/internal.PaginationMeta'
    required:
    - data
    - pagination
    type: object
  internal_users.SetPasswordRequest:
    properties:
      password:
        minLength: 8
        type: string
    required:
    - password
    type: object
  internal_users.UpdateUserRequest:
    properties:
      email:
        type: string
      is_admin:
        type: boolean
      name:
        type: string
    required:
    - email
    - is_admin
    - name
    type: object
  internal_users.UserDataResponse:
    properties:
      data:
        $ref: '#/definitions/internal_users.UserResponse'
    required:
    - data
    type: object
  internal_users.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      id:
        type: integer
      is_admin:
        type: boolean
      name:
        type: string
      updated_at:
        type: string
    required:
    - created_at
    - email
    - email_verified
    - id
    - is_admin
    - name
    - updated_at
    type: object
host: localhost:8747
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: 'Goptimizer: optimizes the images in folders on this server'
  license:
    name: WTFPL
    url: http://www.wtfpl.net/
  termsOfService: http://swagger.io/terms/
  title: Goptimizer API
  version: "1.0"
paths:
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Emails a single-use reset link when the address belongs to an account.
        Always answers 200, so it does not reveal which emails are registered.
      parameters:
      - description: Account email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      summary: Request a password reset
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with email and password
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.LoginDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      summary: Login user
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Logout the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout user
      tags:
      - auth
  /api/v1/auth/me:
    get:
      consumes:
      - application/json
      description: Get information about the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.UserDataResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user info
      tags:
      - auth
    put:
      consumes:
      - application/json
      description: Update name and email for the currently authenticated user
      parameters:
      - description: Profile update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.UserDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update current user
      tags:
      - auth
  /api/v1/auth/me/password:
    put:
      consumes:
      - application/json
      description: Change password for the currently authenticated user. Revokes all
        refresh tokens.
      parameters:
      - description: Password change
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.UpdatePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change current user password
      tags:
      - auth
  /api/v1/auth/me/verify-email:
    post:
      consumes:
      - application/json
      description: Sends a new verification link to the current user's email address
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Resend verification email
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Refresh the access token using a valid refresh token
      parameters:
      - description: Refresh token request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.RefreshTokenDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      summary: Refresh access token
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account with email and password
      parameters:
      - description: Registration request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.RegisterDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      summary: Register new user
      tags:
      - auth
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Sets a new password with the token from the emailed link. The link
        works once; all sessions are signed out.
      parameters:
      - description: Token and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      summary: Reset password
      tags:
      - auth
  /api/v1/auth/verify-email:
    post:
      consumes:
      - application/json
      description: Confirms an email address with the token from the emailed link
      parameters:
      - description: Token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      summary: Verify email
      tags:
      - auth
  /api/v1/folders:
    get:
      description: Every folder, ordered by name. Not paginated.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_folders.FoldersResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List folders
      tags:
      - folders
    post:
      consumes:
      - application/json
      description: Add a folder. The path must be an absolute, readable directory
        outside the system directories that overlaps no other folder; symlinks are
        resolved and the real path is stored. Omitted profile fields take their defaults.
      parameters:
      - description: Folder
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_folders.FolderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_folders.FolderDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create folder
      tags:
      - folders
  /api/v1/folders/{id}:
    delete:
      description: Forget a folder. Its files on disk are not touched.
      parameters:
      - description: Folder ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete folder
      tags:
      - folders
    get:
      parameters:
      - description: Folder ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_folders.FolderDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get folder
      tags:
      - folders
    put:
      consumes:
      - application/json
      description: Replace name, path, intervals and profile, with the same rules
        as create. Does not change whether it is paused.
      parameters:
      - description: Folder ID
        in: path
        name: id
        required: true
        type: integer
      - description: Folder
        in: body
        name: request
        required: true
        schema:
