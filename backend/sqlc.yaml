version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/db/queries"
    schema: "migrations/"
    gen:
      go:
        package: "db"
        out: "internal/db"
        emit_db_tags: true
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: false
        omit_unused_structs: true
        overrides:
          - column: "users.roles"
            go_type:
              type: "Roles"
